[project]
name = "adms-attendance-collector"
version = "2.0.0"
description = "Receives ZKTeco ADMS/PUSH uploads on IIS and writes them into the ATTENDANCEDB attendance database"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["pyodbc==5.3.0", "waitress==3.0.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# Non-Python files must be listed explicitly or the DDL would be missing from an installed copy -- and
# the DDL is what an operator needs on day one.
[tool.setuptools.package-data]
"adms.db" = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package is not installed in development, so the suite needs src on the path. Set here rather than
# with a sys.path line in every test module, and applied before conftest.py is imported.
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = [
    # Blanket 'except Exception' is used deliberately and documented at each site: this service must
    # convert every failure into a status code a device reacts to correctly, because an unhandled
    # exception becomes an IIS error page that some firmware reads as success -- and then erases the
    # punches it just uploaded.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# The DB modules build SQL from module-level identifier constants; the linter cannot see that they are
# constants rather than input.
"src/adms/db/*.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["adms"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# pyodbc and waitress ship no stubs, and the surface we use from each is small and well understood.
ignore_missing_imports = true
